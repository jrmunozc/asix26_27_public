global
    log stdout format raw local0

defaults
    mode http
    timeout connect 1s
    timeout client 1s
    timeout server 1s

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:admin123

frontend http_front
    bind *:80
    default_frontend http_back

backend http_back
    balance random
    server app1 app1:80 check
    server app2 app2:80 check
